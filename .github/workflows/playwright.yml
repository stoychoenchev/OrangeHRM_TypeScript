name: BDD + Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: https://opensource-demo.orangehrmlive.com
      HEADLESS: true
      ORANGEHRM_USERNAME: Admin
      ORANGEHRM_PASSWORD: admin123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber features
        run: >
          node --loader ts-node/esm
          ./node_modules/.bin/cucumber-js
          --import "features/**/*.ts"
          --publish-quiet
          --format progress

      - name: Run Playwright specs
        run: |
          npx playwright test | tee pw.log
          if grep -Eq "0 tests|0 passed" pw.log; then
            echo "No Playwright tests executed. Failing.";
            exit 1;
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: test-results/**/*.zip
          if-no-files-found: ignore

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: test-results/**/*.webm
          if-no-files-found: ignore

      - name: Debug show custom fields steps
        run: sed -n '1,80p' features/steps/pim-custom-fields.steps.ts
      - name: Type check
        run: npx tsc --noEmit

  deploy-report:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - name: Deploy Playwright HTML report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          publish_branch: gh-pages
