name: Cucumber Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (needed for chromium in steps)
        run: npx playwright install --with-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Cucumber
        run: >
          npx cucumber-js
          --require-module ts-node/register
          --require "features/**/*.ts"
          --publish-quiet
          --format progress
